# Train config — emotion-fusion (Anti-Overfitting)
seed: 42
optimizer: AdamW
learning_rate: 0.0003
weight_decay: 0.01
epochs: 30
scheduler: WarmupCosineAnnealingLR
warmup_epochs: 2
freeze_epochs: 2
label_smoothing: 0.1
use_class_weights: true
mixup_alpha: 0.2
use_ema: true
early_stopping:
  patience: 8
  monitor: val_f1_macro
gradient_clipping: 1.0
mixed_precision: true
checkpoint_dir: models/checkpoints
