# Fine-tune AudioCNN trên bộ gộp 7 lớp (Data gốc + DataViet) - giữ đủ 7 cảm xúc
name: audio_datviet_7c
branch: audio
data_root: /content/data_merged
num_classes: 7

model:
  dropout: 0.45

train:
  epochs: 40
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.001
  warmup_epochs: 2
  class_weight: inv_sqrt
  early_stop_patience: 10

augment:
  freq_mask: 24
  time_mask: 32
  n_masks: 2

logging:
  out_dir: runs
